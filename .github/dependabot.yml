# Dependabot (spec §4.7). Weekly on Monday, one grouped PR per ecosystem.
# Security updates are not grouped here, so each one arrives on its own PR.
# Stacks add their ecosystems (npm / pip / gomod, docker) at bootstrap.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
  # The node stack's npm packages. Patch updates share one PR, which the bot
  # approves and auto-merges once ci-ok passes; minor updates share another,
  # which waits for the owner. Major updates arrive one per PR and also wait.
  - package-ecosystem: npm
    directory: /stacks/node
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-patch:
        update-types:
          - patch
      npm-minor:
        update-types:
          - minor
